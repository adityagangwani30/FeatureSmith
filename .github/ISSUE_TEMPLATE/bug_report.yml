name: "🐛 Bug Report"
description: "Report a reproducible bug in Featuresmith."
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible to help us reproduce and fix it quickly.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: "Prerequisites"
      description: "Please confirm the following before submitting."
      options:
        - label: "I searched existing issues and this is not a duplicate."
          required: true
        - label: "I am running Python 3.11+."
          required: true
        - label: "I have reproduced this on the latest version of `main`."
          required: false

  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When I call `fs.analyze(...)`, it raises an unexpected `ConnectorError` even though the file exists."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal reproduction"
      description: "The smallest possible code or command that reproduces the issue."
      render: python
      placeholder: |
        import featuresmith as fs
        result = fs.analyze("data.csv")
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "What actually happened? Include the full error message and traceback."
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Run `uv pip show featuresmith-core featuresmith-cli` and paste the output."
      render: text
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: "Which surface is affected?"
      multiple: true
      options:
        - "Python SDK (import featuresmith as fs)"
        - "CLI (featuresmith analyze ...)"
        - "Dashboard (featuresmith dashboard)"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      description: "Any other information, logs, or screenshots that might help."
