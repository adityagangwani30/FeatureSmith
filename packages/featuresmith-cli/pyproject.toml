[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featuresmith-cli"
version = "0.1.0"
description = "Thin CLI surface for Featuresmith."
requires-python = ">=3.11"
dependencies = [
  "featuresmith-core>=0.1.0",
  "typer~=0.12",
  "rich>=13.7",
]

[project.scripts]
featuresmith = "featuresmith_cli.main:app"

[tool.uv.sources]
featuresmith-core = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["featuresmith_cli*"]
