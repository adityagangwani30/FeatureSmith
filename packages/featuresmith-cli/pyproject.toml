[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featuresmith-cli"
version = "0.2.0"
description = "Command-line interface for Featuresmith, a toolkit to make data quality as routine as code quality."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Featuresmith contributors" },
]
maintainers = [
  { name = "Featuresmith contributors" },
]
requires-python = ">=3.11"
keywords = [
  "cli",
  "data-quality",
  "data-validation",
  "developer-tools",
  "feature-engineering",
  "profiling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "featuresmith-core>=0.2.0",
  "typer~=0.12",
  "rich>=13.7",
]

[project.scripts]
featuresmith = "featuresmith_cli.main:app"

[project.urls]
Homepage = "https://github.com/adityagangwani30/FeatureSmith"
Documentation = "https://featuresmith.adityagangwani.me"
Repository = "https://github.com/adityagangwani30/FeatureSmith"
Issues = "https://github.com/adityagangwani30/FeatureSmith/issues"
Changelog = "https://github.com/adityagangwani30/FeatureSmith/blob/main/CHANGELOG.md"

[tool.uv.sources]
featuresmith-core = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
featuresmith_cli = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["featuresmith_cli*"]
