[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featuresmith-core"
version = "0.0.4-dev"
description = "Reusable core package for Featuresmith."
requires-python = ">=3.11"
dependencies = [
  "openpyxl~=3.1",
  "pandas~=2.2",
  "polars~=1.30",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["featuresmith*"]
