[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featuresmith-core"
version = "0.4.0"
description = "Developer-first Python toolkit for understanding, validating, and improving structured data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Featuresmith contributors" },
]
maintainers = [
  { name = "Featuresmith contributors" },
]
requires-python = ">=3.11"
keywords = [
  "data-quality",
  "data-validation",
  "developer-tools",
  "feature-engineering",
  "profiling",
  "tabular-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "openpyxl~=3.1",
  "pandas~=2.2",
  "polars>=1.34, <2.0",
]

[project.urls]
Homepage = "https://github.com/adityagangwani30/FeatureSmith"
Documentation = "https://featuresmith.adityagangwani.me"
Repository = "https://github.com/adityagangwani30/FeatureSmith"
Issues = "https://github.com/adityagangwani30/FeatureSmith/issues"
Changelog = "https://github.com/adityagangwani30/FeatureSmith/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
featuresmith = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["featuresmith*"]
