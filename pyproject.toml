[project]
name = "featuresmith-workspace"
version = "0.0.4-dev"
description = "Workspace for the Featuresmith core library and thin client surfaces."
requires-python = ">=3.11"
dependencies = [
  "featuresmith-core>=0.0.4-dev",
  "featuresmith-cli>=0.0.4-dev",
  "featuresmith-dashboard>=0.0.4-dev",
  "ruff>=0.12.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pre-commit>=4.2.0",
  "import-linter>=2.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
featuresmith-core = { workspace = true }
featuresmith-cli = { workspace = true }
featuresmith-dashboard = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/featuresmith-core",
  "packages/featuresmith-cli",
  "packages/featuresmith-dashboard",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = [
  "packages/featuresmith-core/src",
  "packages/featuresmith-cli/src",
  "packages/featuresmith-dashboard/src",
  "tests",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = [
  "packages",
  "tests",
]
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.importlinter]
root_packages = [
  "featuresmith",
  "featuresmith_cli",
  "featuresmith_dashboard",
]

[[tool.importlinter.contracts]]
name = "Thin clients may only import featuresmith.api"
type = "forbidden"
source_modules = [
  "featuresmith_cli",
  "featuresmith_dashboard",
]
forbidden_modules = [
  "featuresmith.core",
  "featuresmith.profiling",
]
