[project]
name = "featuresmith-workspace"
version = "0.3.0"
description = "Workspace for the Featuresmith core library and thin client surfaces."
requires-python = ">=3.11"
dependencies = [
  "featuresmith-core>=0.2.0",
  "featuresmith-cli>=0.2.0",
  "featuresmith-dashboard>=0.2.0",
]

[dependency-groups]
dev = [
  "ruff>=0.12.0",
  "mypy>=1.17.0",
  "pre-commit>=4.2.0",
  "import-linter>=2.13.0",
]
test = [
  "pytest>=8.4.0",
  "scikit-learn>=1.9.0",
]
release = [
  "twine>=6.1.0",
]


[tool.uv]
package = false

[tool.uv.sources]
featuresmith-core = { workspace = true }
featuresmith-cli = { workspace = true }
featuresmith-dashboard = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/featuresmith-core",
  "packages/featuresmith-cli",
  "packages/featuresmith-dashboard",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["*.md"]
src = [
  "packages/featuresmith-core/src",
  "packages/featuresmith-cli/src",
  "packages/featuresmith-dashboard/src",
  "tests",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = [
  "packages",
  "tests",
]
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
  "^examples/",
  "^benchmarks/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.importlinter]
root_packages = [
  "featuresmith",
  "featuresmith_cli",
  "featuresmith_dashboard",
]

[[tool.importlinter.contracts]]
name = "Thin clients may only import featuresmith.api"
type = "forbidden"
source_modules = [
  "featuresmith_cli",
  "featuresmith_dashboard",
]
forbidden_modules = [
  "featuresmith.core",
  "featuresmith.profiling",
]
ignore_imports = [
  # featuresmith.api is the only permitted entrypoint for thin clients.
  # All edges below are transitive paths that route *through* featuresmith.api;
  # direct imports from featuresmith_cli into featuresmith.core remain forbidden.
  "featuresmith.api -> featuresmith.core.dataset",
  "featuresmith.api -> featuresmith.core.exceptions",
  "featuresmith.api -> featuresmith.core.profile_result",
  "featuresmith.api -> featuresmith.core.rule_result",
  "featuresmith.api -> featuresmith.profiling",
  "featuresmith.api -> featuresmith.connectors.registry",
  "featuresmith.api -> featuresmith.rules.engine",
  "featuresmith.connectors.registry -> featuresmith.core.dataset",
  "featuresmith.connectors.registry -> featuresmith.core.exceptions",
  "featuresmith.connectors.registry -> featuresmith.connectors.csv_connector",
  "featuresmith.connectors.registry -> featuresmith.connectors.excel_connector",
  "featuresmith.connectors.registry -> featuresmith.connectors.parquet_connector",
  "featuresmith.connectors.registry -> featuresmith.connectors.dataframe_connector",
  "featuresmith.rules.engine -> featuresmith.core.profile_result",
  "featuresmith.rules.engine -> featuresmith.core.rule_result",
  "featuresmith.rules.engine -> featuresmith.core.rule_finding",
  "featuresmith.api -> featuresmith.review.schema",
  "featuresmith.api -> featuresmith.review.render",
  "featuresmith.api -> featuresmith.review.engine",
  "featuresmith.review.aggregator -> featuresmith.core.profile_result",
  "featuresmith.review.engine -> featuresmith.core.dataset",
  "featuresmith.review.engine -> featuresmith.core.profile_result",
  "featuresmith.review.engine -> featuresmith.core.rule_finding",
  "featuresmith.review.context -> featuresmith.core.dataset",
  "featuresmith.review.context -> featuresmith.core.profile_result",
  "featuresmith.review.context -> featuresmith.core.rule_finding",
  "featuresmith.review.schema -> featuresmith.core.profile_result",
  "featuresmith.review.schema -> featuresmith.core.rule_finding",
  "featuresmith.api -> featuresmith.scoring.schema",
  "featuresmith.scoring.schema -> featuresmith.core.profile_result",
  "featuresmith.api -> featuresmith.scoring.aggregator",
  "featuresmith.scoring.aggregator -> featuresmith.core.rule_finding",
  # Dataset Diff Engine (featuresmith.diff) lives under the root package and is
  # reached through featuresmith.api; its reuse of profiling/rule schemas is the
  # same sanctioned pattern as the Review Engine.
  "featuresmith.api -> featuresmith.diff.engine",
  "featuresmith.api -> featuresmith.diff.findings",
  "featuresmith.api -> featuresmith.diff.schema",
  "featuresmith.diff.engine -> featuresmith.core.profile_result",
  "featuresmith.diff.engine -> featuresmith.review.context",
  "featuresmith.diff.engine -> featuresmith.review.reviewers.leakage",
  "featuresmith.diff.findings -> featuresmith.core.rule_finding",
  "featuresmith.diff.schema -> featuresmith.core.profile_result",
]
